[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renglo"
version = "0.1.6rc4"
description = "Renglo environment command"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "renglo-ops"]

[project.optional-dependencies]
cdk = ["renglo-ops[cdk]"]
dev = ["pytest>=7.0.0"]

[project.scripts]
renglo = "renglo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["renglo"]
