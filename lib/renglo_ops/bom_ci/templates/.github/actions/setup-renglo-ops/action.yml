name: Setup renglo-ops
description: >
  Install the renglo-ops release library pinned by platform in renglo.yaml
  from CodeArtifact, then materialize the image Dockerfile and shell helpers.
  Does not clone renglo-ops or any other repository.
inputs:
  stage:
    description: >
      Deploy-role stage. Must match this job's GitHub environment so the OIDC
      subject can assume GitHubActionsDeployRole-<name>-<stage>.
    required: false
    default: staging
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Resolve platform pin
      id: pin
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
      run: |
        set -euo pipefail
        if [[ ! -f renglo.yaml ]]; then
          echo "renglo.yaml not found." >&2
          exit 1
        fi
        python3 -m pip install --quiet pyyaml
        python3 - <<'PY'
        import json
        import os
        import re
        from pathlib import Path

        import yaml

        stage = os.environ["STAGE"].strip()
        data = yaml.safe_load(open("renglo.yaml")) or {}
        version = str(data.get("platform") or "").strip()
        if stage == "staging":
            staging = data.get("staging") or {}
            if isinstance(staging, dict):
                staged = str(staging.get("platform") or "").strip()
                if staged:
                    version = staged
        if version.startswith("v") and len(version) > 1 and version[1].isdigit():
            version = version[1:]
        if not re.fullmatch(r"\d+\.\d+\.\d+(?:[a-zA-Z][0-9A-Za-z.]*)?", version):
            raise SystemExit(
                f"renglo.yaml platform must be a package version, got {version!r}"
            )
        name = str(data.get("name") or "").strip()
        accounts = data.get("accounts") or {}
        account = accounts.get(stage) if isinstance(accounts, dict) else None
        if not isinstance(account, dict):
            raise SystemExit(f"renglo.yaml has no accounts.{stage}")
        account_id = str(account.get("id") or "").strip()
        region = str(account.get("region") or "us-east-1").strip() or "us-east-1"
        if not name or not account_id:
            raise SystemExit(f"renglo.yaml name or accounts.{stage}.id is empty")
        role = f"arn:aws:iam::{account_id}:role/GitHubActionsDeployRole-{name}-{stage}"

        registries = []
        for index, item in enumerate(data.get("registries") or []):
            if not isinstance(item, dict):
                raise SystemExit(f"renglo.yaml registries[{index}] must be a mapping")
            domain = str(item.get("domain") or "").strip()
            python_repository = str(item.get("python") or "python-store").strip() or "python-store"
            owner = str(item.get("account") or "").strip() or account_id
            if not domain:
                raise SystemExit(f"renglo.yaml registries[{index}].domain is empty")
            registries.append(
                {
                    "domain": domain,
                    "domain_owner": owner,
                    "python_repository": python_repository,
                    "region": region,
                }
            )
        if not registries:
            raise SystemExit("renglo.yaml registries is empty; cannot install renglo-ops")

        path = Path(os.environ["RUNNER_TEMP"]) / "renglo-registries.json"
        path.write_text(json.dumps(registries), encoding="utf-8")
        output = Path(os.environ["GITHUB_OUTPUT"])
        with output.open("a", encoding="utf-8") as handle:
            handle.write(f"version={version}\n")
            handle.write(f"role_arn={role}\n")
            handle.write(f"region={region}\n")
            handle.write(f"registries={path}\n")
        PY

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ steps.pin.outputs.role_arn }}
        aws-region: ${{ steps.pin.outputs.region }}

    - name: Install renglo-ops from CodeArtifact
      shell: bash
      env:
        RENGL_VERSION: ${{ steps.pin.outputs.version }}
        REGISTRIES_FILE: ${{ steps.pin.outputs.registries }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import subprocess
        import sys
        from urllib.parse import quote, urlparse, urlunparse

        registries = json.loads(open(os.environ["REGISTRIES_FILE"], encoding="utf-8").read())

        def aws(*args: str) -> str:
            result = subprocess.run(
                ["aws", "codeartifact", *args, "--output", "text"],
                check=False,
                text=True,
                capture_output=True,
            )
            if result.returncode != 0:
                sys.stderr.write(result.stderr or result.stdout or "")
                raise SystemExit(result.returncode)
            return (result.stdout or "").strip()

        def login(entry: dict) -> None:
            subprocess.run(
                [
                    "aws",
                    "codeartifact",
                    "login",
                    "--tool",
                    "pip",
                    "--domain",
                    entry["domain"],
                    "--domain-owner",
                    entry["domain_owner"],
                    "--repository",
                    entry["python_repository"],
                    "--region",
                    entry["region"],
                ],
                check=True,
            )

        def extra_index(entry: dict) -> str:
            endpoint = aws(
                "get-repository-endpoint",
                "--domain",
                entry["domain"],
                "--domain-owner",
                entry["domain_owner"],
                "--repository",
                entry["python_repository"],
                "--format",
                "pypi",
                "--region",
                entry["region"],
                "--query",
                "repositoryEndpoint",
            )
            token = aws(
                "get-authorization-token",
                "--domain",
                entry["domain"],
                "--domain-owner",
                entry["domain_owner"],
                "--region",
                entry["region"],
                "--query",
                "authorizationToken",
            )
            parsed = urlparse(endpoint.rstrip("/") + "/simple/")
            netloc = f"aws:{quote(token, safe='')}@{parsed.netloc}"
            return urlunparse((parsed.scheme, netloc, parsed.path, "", "", ""))

        login(registries[0])
        extras = [extra_index(entry) for entry in registries[1:]]
        if extras:
            subprocess.run(
                [
                    sys.executable,
                    "-m",
                    "pip",
                    "config",
                    "set",
                    "global.extra-index-url",
                    " ".join(extras),
                ],
                check=True,
            )
        PY
        python3 -m pip install --quiet "renglo-ops==${RENGL_VERSION}"
        python3 -m renglo_ops.image
        python3 - <<'PY'
        import os
        import shutil
        from pathlib import Path

        import renglo_ops.release as release

        version = os.environ["RENGL_VERSION"]
        src = Path(release.__file__).resolve().parent
        dest = Path("scripts")
        dest.mkdir(exist_ok=True)
        shells = sorted(src.glob("*.sh"))
        if not shells:
            raise SystemExit(
                f"renglo-ops=={version} from CodeArtifact has no release shell scripts. "
                "Publish a build that includes them and pin that version in platform. "
                "This workflow does not clone the repository."
            )
        for path in shells:
            target = dest / path.name
            shutil.copy2(path, target)
            target.chmod(0o755)
        PY
        test -f Dockerfile
        test -f scripts/install_backend_packages.py
        test -f scripts/stage_extension_blueprints.py
        test -f scripts/deploy_amplify_console.sh
        echo "Using renglo-ops==${RENGL_VERSION} from CodeArtifact"
