[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renglo-ops"
version = "0.1.6"
description = "Renglo environment library: tenant model, hub, peers, registry, and release"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Pin to the library that last deployed stanley0731-stack-a. 2.114 rewrites IAM
# service principals and replaces RuntimeTenantPolicy, which deletes the
# cross-stack export stanley0731-stack-b still imports.
cdk = ["aws-cdk-lib==2.273.0", "constructs>=10.0.0,<11.0.0", "boto3"]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["renglo_ops*"]

[tool.setuptools.package-data]
renglo_ops = ["image_data/*", "release/*.sh", "bom_ci/templates/**"]
